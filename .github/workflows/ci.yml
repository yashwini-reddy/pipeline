
name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}      # YOUR EMAIL (sender)
          password: ${{ secrets.EMAIL_PASSWORD }}      # YOUR APP PASSWORD
          
          subject: >
            GitHub Notification -
            ${{ github.event_name == 'pull_request' && 'New Pull Request' || 'New Push' }}

          # 👇 Recipient logic
          to: >
            ${{ github.event_name == 'push'
                && github.event.head_commit.author.email
                || github.event.pull_request.user.email }}

          from: "GitHub CI <${{ secrets.EMAIL_USERNAME }}>"

          body: |
            Event        : ${{ github.event_name }}
            Branch       : ${{ github.ref }}
            Commit SHA   : ${{ github.sha }}
            Actor        : ${{ github.actor }}

            # Push Information
            Committer Email : ${{ github.event.head_commit.author.email }}
            Commit Message  : ${{ github.event.head_commit.message }}

            # PR Information
            PR Title     : ${{ github.event.pull_request.title }}
            PR Number    : ${{ github.event.pull_request.number }}
            PR URL       : ${{ github.event.pull_request.html_url }}
            PR Author    : ${{ github.event.pull_request.user.login }}
            PR Author Email : ${{ github.event.pull_request.user.email }}
            PR Source    : ${{ github.event.pull_request.head.ref }}
            PR Target    : ${{ github.event.pull_request.base.ref }}
